<main class="contador">
  <h1>{{ titulo() }}</h1>

  <p class="deescrição">Meu primeiro projeto pratico em Angular</p>

  <section class="painel">
    <p>Valor Atual</p>

    <strong
      [class]="['valor', situacao()]"
      >
      {{ contador() }}
      </strong>

      @if (situacao() === "positivo") {
        <p class="mensagem positivo"> o valor está positivo</p>
      } @else if (situacao() === "negativo") {
        <p class="mensagem negativo">o valor esta negativo</p>
      }@else {
        <p class="mensagem zero">O contador está zerado</p>
      }

    <label class="configuracao">
      Incremento

      <input type="number" min="1" [value]="incremento()" (input)="alterarIncremento($event)" />
    </label>
    <div class="acoes">
      <button (click)="diminuir()" class="button">Diminuir</button>
      <button (click)="zerar()" [disabled]="contador() === 0" >Zerar</button>
      <button (click)="aumentar()" class="button">Aumentar</button>
    </div>
  </section>
</main>
